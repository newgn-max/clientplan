
<style>
  .fp-wrap { font-family: var(--font-sans); padding: 1rem 0; }
  .fp-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .fp-tab { padding: 6px 18px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; background: var(--color-background-primary); color: var(--color-text-secondary); }
  .fp-tab.active { background: #185FA5; color: #fff; border-color: #185FA5; font-weight: 500; }
  .fp-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .fp-badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: var(--color-background-secondary); color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); }
  .fp-canvas { width: 100%; }
  .fp-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 1rem; }
  .fp-leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
  .fp-leg-box { width: 14px; height: 14px; border-radius: 2px; border: 0.5px solid rgba(0,0,0,0.15); flex-shrink: 0; }
</style>

<script>
function showFloor(f) {
  document.getElementById('ground-floor').style.display = f==='ground'?'block':'none';
  document.getElementById('first-floor').style.display = f==='first'?'block':'none';
  document.querySelectorAll('.fp-tab').forEach((t,i)=>{
    t.classList.toggle('active', (i===0&&f==='ground')||(i===1&&f==='first'));
  });
}
</script>
